name: repo-onboarding-assistant
version: 0.1.0
description: Scan a source repository, enrich its RepositoryModel with analyzers, and generate onboarding artifacts.
entrypoint: onboarding_skill.py
entry_function: run_onboarding
harness: llm-harness-lite (>=0.1.0)
inputs:
  - name: repository
    type: string
    required: true
    description: Path to the repository to analyze
  - name: output_dir
    type: string
    required: false
    default: outputs
    description: Directory for generated artifacts
outputs:
  - summary.md
  - learning_path.md
  - repository_map.json
  - manifest.json
result:
  type: SkillResult
  summary: Repository onboarding analysis completed
capabilities:
  - name: repository-scan
    module: repository_scan.py
    description: Convention-based scan and analyzer enrichment for metadata, frameworks, dependencies, files, directories, and patterns
