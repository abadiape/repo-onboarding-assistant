name: repo-onboarding-assistant
version: 0.1.0
description: Scan a source repository, enrich its RepositoryModel with analyzers, and generate onboarding artifacts.
entrypoint: onboarding_skill.py
entry_function: run_onboarding
harness: llm-harness-lite (>=0.2.0)
inputs:
  - name: repository
    type: string
    required: true
    description: Path to the repository to analyze
  - name: output_dir
    type: string
    required: false
    default: outputs
    description: Directory for generated artifacts
outputs:
  - summary.md
  - learning_path.md
  - repository_map.json
  - business_domains.md
  - business_capabilities.md
  - onboarding_priorities.md
  - domain_map.json
  - executive_summary.md
  - critical_modules.md
  - first_week_onboarding.md
  - business_insights.md
  - manifest.json
result:
  type: SkillResult
  summary: Repository onboarding analysis completed
capabilities:
  - name: repository-scan
    module: ../analyzers/repository_scan.py
    description: Convention-based scan and analyzer enrichment for metadata, frameworks, dependencies, files, directories, and patterns
  - name: domain-discovery
    module: ../analyzers/domain_discovery.py
    description: Heuristic business domains, capabilities, integrations, and business-first onboarding priorities
  - name: business-insights
    module: ../analyzers/business_insights.py
    description: Rank domain impact, critical modules, integrations, and first-week onboarding actions
